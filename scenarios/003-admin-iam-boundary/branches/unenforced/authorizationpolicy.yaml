# Service mesh authorization for tenant-admin.

---
# NOTE(platform, 2025-06): the platform-admin namespace is in the mesh and gets
# mTLS in PERMISSIVE mode from the mesh-wide default, but no AuthorizationPolicy
# has been written for it. Istio's behaviour with no ALLOW policy selecting a
# workload is allow-by-default, so any workload in the mesh can call tenant-admin.
#
# Tracked as PLAT-4471, unscheduled.

apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: platform-admin
spec:
  mtls:
    # PERMISSIVE accepts both mTLS and plaintext. Any pod that can route to the
    # service — including workloads outside the mesh — is accepted.
    mode: PERMISSIVE

---
# The only network-level restriction in this namespace is an ingress NetworkPolicy
# that permits the whole product namespace, which hosts ~40 services including
# tenant-facing request handlers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-admin-ingress
  namespace: platform-admin
spec:
  podSelector:
    matchLabels:
      app: tenant-admin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: product
      ports:
        - protocol: TCP
          port: 8080
